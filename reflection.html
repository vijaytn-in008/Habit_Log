<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reflect — Behavior Log</title>
  <meta name="description" content="Discover patterns in your habits and tasks.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== Header ====== -->
  <header class="header container">
    <h1>Reflect</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="refresh-btn" class="refresh-btn" aria-label="Refresh insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"/>
          <path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Refresh
      </button>
      <button id="install-btn" class="theme-toggle hidden" aria-label="Install App" title="Install App">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
      </button>
      <button id="settings-btn" class="theme-toggle" aria-label="API Settings" title="API Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    </div>
  </header>

  <!-- ====== Settings Modal ====== -->
  <div id="settings-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2>Backend Settings</h2>
        <button id="settings-close" class="modal-close" aria-label="Close">✕</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">
        Paste your Google Apps Script Web App URL below. This is stored securely in your local browser only.
      </p>
      <input type="password" id="api-url-input" class="notes-field" style="min-height: 48px; margin-bottom: 20px;" placeholder="https://script.google.com/macros/s/.../exec">
      <button id="settings-save-btn" class="save-btn">Save Settings</button>
    </div>
  </div>

  <!-- ====== Content ====== -->
  <main class="container">
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>Analyzing your data…</p>
    </div>
    <div id="insights" class="insight-list"></div>
  </main>

  <!-- ====== Bottom Navigation ====== -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-item" aria-label="Habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>Habits</span>
      </a>
      <a href="tasks.html" class="nav-item" aria-label="Tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M10 7h4M8 12h8M8 16h5"/>
        </svg>
        <span>Tasks</span>
      </a>
      <a href="reflection.html" class="nav-item active" aria-label="Reflect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span>Reflect</span>
      </a>
    </div>
  </nav>

  <!-- ====== Scripts ====== -->
  <script src="script.js"></script>
  <script src="analysis.js"></script>
  <script>
    /**
     * Fetch logs from Google Sheets, generate insights,
     * and render them as cards.
     */
    async function initReflectionPage() {
      const loading  = document.getElementById('loading');
      const container = document.getElementById('insights');

      try {
        const data = await fetchLogs();
        const logs = data.data || data;
        const insights = generateInsights(logs);

        loading.classList.add('hidden');
        renderInsights(insights, container);
      } catch (err) {
        loading.innerHTML = '<p>Could not load data.<br>Check your connection.</p>';
        console.error(err);
      }
    }

    /**
     * Render insight objects as styled cards.
     * @param {Array}       insights  — [{title, text, tone}, ...]
     * @param {HTMLElement}  container — target element
     */
    function renderInsights(insights, container) {
      container.innerHTML = '';

      insights.forEach((insight, i) => {
        const card = document.createElement('div');
        card.className = `insight-card ${insight.tone || 'neutral'}`;
        card.style.animationDelay = `${i * 0.06}s`;

        const title = document.createElement('div');
        title.className = 'insight-title';
        title.textContent = insight.title;

        const text = document.createElement('div');
        text.className = 'insight-text';
        text.textContent = insight.text;

        card.appendChild(title);
        card.appendChild(text);
        container.appendChild(card);
      });
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', initReflectionPage);

    // Refresh button
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('refresh-btn').addEventListener('click', () => {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('insights').innerHTML = '';
        initReflectionPage();
      });
    });
  </script>
</body>
</html>
